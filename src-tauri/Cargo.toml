[package]
name = "hnd-factory-desktop"
version = "1.0.20"
description = "HND 生产助手 桌面端"
authors = ["HND"]
edition = "2021"
rust-version = "1.77"

# Windows 下双击不要弹出黑色控制台窗口（release 构建）。
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lib]
name = "hnd_factory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：关闭后收进托盘（用户 2026-11-11 要求）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生窗口材质（2026-11-11 用户要求）：Windows 10/11 的亚克力/云母由系统合成器画，
# 不是前端 backdrop-filter 模拟 —— 抄表页的滑动/滚动因此不会被模糊拖慢。
window-vibrancy = "0.6"
