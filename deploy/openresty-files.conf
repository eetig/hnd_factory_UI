# 生产站必须有的 /files 反代（变更-084）
#
# 这份文件是 2026-10-16 加到生产机上的那条路由的**原样副本**，放在仓库里是为了
# 下次重装/迁移站点时不会漏掉它 —— 漏掉的后果是「所有上传的底图全挂」，而且不报错。
#
# ── 背景（实测记录，别删） ─────────────────────────────────────────────
# `equipment_ledger.image_file` 在上传底图后存的是 `/files/<32hex>.png`，
# 而前端是**同源**取图的（站点 origin；接口走同源的 /api 反代）。
# 生产站 `www/sites/hnd-ui/proxy/` 里原先只有 `api.conf`（/api → 127.0.0.1:8084），
# 于是 `/files/xxx.png` 直接落到 SPA 的 404.html：
#     curl http://127.0.0.1:9091/files/<name>  →  HTTP 404, 130 B, text/html
# 站点主配置里已经有 `include /www/sites/hnd-ui/proxy/*.conf;`，
# 所以**加这个文件即生效**，不必改主配置；回滚就是删掉这个文件 + reload。
#
# ── 安装（生产机） ────────────────────────────────────────────────────
#   sudo cp openresty-files.conf \
#     /opt/1panel/apps/openresty/openresty/www/sites/hnd-ui/proxy/files.conf
#   sudo chown root:root .../files.conf && sudo chmod 644 .../files.conf
#   docker exec myOpenresty nginx -t          # 语法检查
#   docker exec myOpenresty nginx -s reload   # 生效
#   curl -o /dev/null -w '%{http_code}\n' http://127.0.0.1:9091/files/<32hex>.png   # 期望 200
#
# ⚠️ 手机端（uni-app）也依赖这条路由：它的 `src/api/config.js` 里写着
#    「H5 端由 vite 代理（开发）/ Nginx 同源路由（生产）把 /files、/thumbs
#      重写成 img-service 的 /api/img/file、/api/img/thumb」。
#    也就是说这条路由本来就该在，只是一直没有数据用到 `/files` 才没暴露。
#
# 反代目标：img-service 发布在宿主机 127.0.0.1:8082（容器 myOpenresty 走 host 网络，
# 与 api.conf 反代 127.0.0.1:8084 是同一个用法）。
#
# 缓存：文件名是 UUID、内容与名字一一对应且永不复用 → 可以长期 immutable
# （与 img-service 自己发的 Cache-Control 一致：7 天 + immutable）。

location ^~ /files/ {
    proxy_pass http://127.0.0.1:8082/api/img/file/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    expires 7d;
    add_header Cache-Control "public, immutable";
}
